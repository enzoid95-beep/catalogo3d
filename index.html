<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impressões 3D - Dr. Leiras</title>
  <meta name="description" content="Coleção de bonecos e peças impressos em 3D por Dr. Leiras.">
  <meta name="theme-color" content="#0e1710">
  <meta property="og:title" content="Impressões 3D - Dr. Leiras">
  <meta property="og:description" content="Coleção de bonecos e peças impressos em 3D.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧸%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Minha coleção</p>
      <h1><span class="l1">Impressões 3D</span><span class="l2">Dr. Leiras</span></h1>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <input id="search" type="search" placeholder="Buscar boneco, categoria, tag..." aria-label="Buscar">
      <div class="chips" id="chips"></div>
      <select id="sort" aria-label="Ordenar">
        <option value="recent">Mais recentes</option>
        <option value="name">Nome (A–Z)</option>
        <option value="time">Maior tempo de impressão</option>
      </select>
    </section>

    <p class="resultado" id="resultado" aria-live="polite"></p>
    <section class="grid" id="grid"></section>
    <div class="empty" id="empty" hidden>
      <p>Nenhum boneco encontrado 😢</p>
      <button class="limpar" id="limpar" type="button">Limpar busca</button>
    </div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-card">
      <button class="lb-close" id="lbClose" aria-label="Fechar">×</button>
      <div class="lb-img" id="lbImg"></div>
      <div class="lb-info" id="lbInfo"></div>
    </div>
  </div>

  <footer>Feito com ♥ e filamento · <span id="year"></span></footer>

  <script src="data.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
